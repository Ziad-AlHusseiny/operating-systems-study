<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Practice the official ITS Device Configuration and Management question banks."
    />
    <meta name="color-scheme" content="light dark" />
    <title>ITS Device Configuration and Management</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 64 64%22><rect width=%2264%22 height=%2264%22 rx=%2214%22 fill=%22%230878f9%22/><text x=%2232%22 y=%2241%22 text-anchor=%22middle%22 font-family=%22Arial%22 font-size=%2226%22 font-weight=%22700%22 fill=%22white%22>ITS</text></svg>">
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="app-shell" id="app-shell">
      <aside class="sidebar" id="sidebar" aria-label="Main navigation">
        <div class="sidebar__brand" aria-label="ITS Study">
          <span class="brand-mark" aria-hidden="true">ITS</span>
          <span class="brand-copy">Study</span>
        </div>
        <nav class="sidebar__nav">
          <a class="nav-item is-active" href="#/dashboard" data-route="dashboard">
            <span class="nav-item__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10a1 1 0 0 1-1 1h-5v-7H9v7H4a1 1 0 0 1-1-1Z"/></svg>
            </span>
            <span>Dashboard</span>
          </a>
          <a class="nav-item" href="#/practice" data-route="practice">
            <span class="nav-item__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="m4 20 4.2-1 11-11a2.4 2.4 0 0 0-3.4-3.4l-11 11Z"/><path d="m14.5 6 3.5 3.5"/></svg>
            </span>
            <span>Practice</span>
          </a>
          <a class="nav-item" href="#/exam" data-route="exam">
            <span class="nav-item__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6Z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></svg>
            </span>
            <span>Mock Exam</span>
          </a>
          <a class="nav-item" href="#/bank" data-route="bank">
            <span class="nav-item__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="m4 7 8-4 8 4-8 4Z"/><path d="m4 12 8 4 8-4M4 17l8 4 8-4"/></svg>
            </span>
            <span>Question Bank</span>
          </a>
          <a class="nav-item" href="#/explanations" data-route="explanations">
            <span class="nav-item__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M5 4h14v16H5Z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg>
            </span>
            <span>Question Explanations</span>
          </a>
          <a class="nav-item" href="#/revision" data-route="revision">
            <span class="nav-item__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
            </span>
            <span>Revision Summary</span>
          </a>
          <a class="nav-item" href="#/mistakes" data-route="mistakes">
            <span class="nav-item__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m9 9 6 6m0-6-6 6"/></svg>
            </span>
            <span>Mistakes</span>
          </a>
          <a class="nav-item" href="#/bookmarks" data-route="bookmarks">
            <span class="nav-item__icon" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M6 3h12v18l-6-4-6 4Z"/></svg>
            </span>
            <span>Bookmarks</span>
          </a>
        </nav>
        <button class="sidebar__collapse" type="button" id="sidebar-collapse">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></svg>
          <span>Collapse</span>
        </button>
      </aside>

      <div class="workspace">
        <header class="topbar">
          <a class="topbar__course" href="#/dashboard">
            ITS Device Configuration and Management
          </a>
          <button class="theme-toggle" type="button" id="theme-toggle" aria-label="Switch to dark mode">
            <svg class="theme-toggle__sun" aria-hidden="true" viewBox="0 0 24 24">
              <circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>
            </svg>
            <svg class="theme-toggle__moon" aria-hidden="true" viewBox="0 0 24 24">
              <path d="M20 15.4A8.5 8.5 0 0 1 8.6 4 8.5 8.5 0 1 0 20 15.4Z"/>
            </svg>
            <span id="theme-toggle-label">Dark</span>
          </button>
        </header>
        <main class="main-content" id="main-content" tabindex="-1">
          <div class="loading-state" role="status">
            <span class="spinner" aria-hidden="true"></span>
            <span>Loading the official question bank…</span>
          </div>
        </main>
      </div>
    </div>

    <nav class="mobile-nav" id="mobile-nav" aria-label="Mobile navigation">
      <a class="mobile-nav__item is-active" href="#/dashboard" data-route="dashboard">Home</a>
      <a class="mobile-nav__item" href="#/practice" data-route="practice">Practice</a>
      <a class="mobile-nav__item" href="#/exam" data-route="exam">Exam</a>
      <a class="mobile-nav__item" href="#/bank" data-route="bank">Bank</a>
      <div class="mobile-nav__more" id="mobile-more-slot"></div>
    </nav>

    <div class="toast-region" id="toast-region" aria-live="polite" aria-atomic="true"></div>
    <div id="dialog-root"></div>
    <input type="file" id="progress-file-input" accept="application/json,.json" hidden />
    <script type="module" src="./js/app.js"></script>
  </body>
</html>
